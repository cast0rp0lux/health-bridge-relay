name: Send nutrition to Health Bridge

on:
  push:
    paths:
      - "inbox/*.json"

jobs:
  send:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate relay configuration
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          echo "Relay configuration present."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Send only changed nutrition JSON files
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FCM_TOPIC: healthbridge-alberto
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          # Only send JSON files changed in this push. Never replay the whole inbox.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA" -- 'inbox/*.json')
          else
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$BEFORE_SHA" "$CURRENT_SHA" -- 'inbox/*.json')
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed nutrition JSON files to send."
            exit 0
          fi

          for FILE in "${FILES[@]}"; do
            [ -f "$FILE" ] || continue
            bash tests/validate-nutrition-operation-v1.sh "$FILE"
            echo "Sending changed file $FILE to FCM..."

            PAYLOAD="$(jq -c --arg topic "$FCM_TOPIC" '
              {
                message: {
                  topic: $topic,
                  data: (
                    to_entries
                    | map({key: .key, value: (.value | tostring)})
                    | from_entries
                  )
                }
              }
            ' "$FILE")"

            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; UTF-8" \
              "https://fcm.googleapis.com/v1/projects/$FIREBASE_PROJECT_ID/messages:send" \
              -d "$PAYLOAD"

            echo
            echo "Sent $FILE successfully."
          done
